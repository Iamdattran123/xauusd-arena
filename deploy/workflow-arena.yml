# ⚠️ BẢN NÂNG CẤP (v2) — dùng THAY THẾ .github/workflows/arena.yml
# Khi tài khoản GitHub của bạn có quyền push (tài khoản cá nhân bình thường thì có),
# copy nội dung file này đè lên .github/workflows/arena.yml rồi commit.
# Khác biệt so với bản gốc: chạy 38 unit test trước mỗi phiên + concurrency guard.
#
name: Arena Auto-Run 24/7

# Chạy tự động MỖI 1 GIỜ = 24 phiên/ngày (24/7, gồm AI Trader mô phỏng $1.000)
# Phiên cuối tuần/lễ vẫn chạy để AI NHẬN BIẾT thị trường đóng (báo cáo ghi rõ,
# AI Trader không mở lệnh). Muốn bỏ hẳn phiên nghỉ → thêm --skip-closed vào lệnh run.
# Cần 6 GitHub Secrets: OPENROUTER_API_KEY · GEMINI_API_KEY · GROQ_API_KEY · COHERE_API_KEY · TELEGRAM_BOT_TOKEN · TELEGRAM_CHAT_ID
"on":
  schedule:
    - cron: '0 * * * *'   # chạy đầu mỗi giờ
  workflow_dispatch: {}   # bấm "Run workflow" để chạy tay bất cứ lúc nào

concurrency:
  group: arena-run        # chống 2 run ghi đè state cùng lúc
  cancel-in-progress: false

jobs:
  run-simulation:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Cài thư viện
        run: pip install numpy

      - name: 🧪 Chạy unit test (38 test)
        run: python -m unittest discover -s tests

      # ---- KIỂM TRA TELEGRAM TRƯỚC (nhìn log là biết secret đúng/sai ngay) ----
      - name: 🔔 Kiểm tra Telegram (getMe + gửi tin test)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "Độ dài token: ${#TELEGRAM_BOT_TOKEN} ký tự (bot token chuẩn ~46)"
          echo "--- getMe: kiểm tra token ---"
          curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getMe" | head -c 300
          echo ""
          echo "--- Gửi tin test qua Telegram ---"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=🔔 Kết nối Telegram từ GitHub Actions OK!" | head -c 300
          echo ""

      - name: Chạy phiên mô phỏng + AI Trader 24/7
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python app.py --timeframe 1h --rounds 2 --voters 80 --paths 300

      - name: Commit kết quả (dashboard + backtest + trader_state)
        run: |
          git config user.name "arena-bot"
          git config user.email "arena-bot@users.noreply.github.com"
          git add output/
          git commit -m "auto: phiên $(date -u +%Y-%m-%dT%H:%MZ)" || echo "Không có thay đổi — bỏ qua commit"
          git push
